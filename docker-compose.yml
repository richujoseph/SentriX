services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      EVE_LOG_PATH: /logs/eve.json
      SCAN_SUBNET: ${SCAN_SUBNET:-172.30.0.0/24}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app/app
      - ./logs:/logs:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  suricata:
    image: jasonish/suricata:7.0
    # Offline mode: on every start, reprocess all captures in pcaps/ into a fresh
    # logs/eve.json, then exit. Re-run with `docker compose restart suricata`.
    entrypoint: ["/bin/sh", "/sentrix-run.sh"]
    restart: "no"
    volumes:
      - ./suricata/run.sh:/sentrix-run.sh:ro
      - ./suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
      - ./suricata/rules/local.rules:/etc/suricata/rules/local.rules:ro
      - ./pcaps:/pcaps:ro
      - ./logs:/var/log/suricata

  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # --- Lab targets: real hosts for the asset scanner and attack scenarios. ---
  # Fixed IPs on the lab network; no ports are published to the host.

  target-ssh:
    build: ./targets/ssh
    hostname: target-ssh
    restart: unless-stopped
    environment:
      SSH_USER: ${TARGET_SSH_USER:-labuser}
      SSH_PASSWORD: ${TARGET_SSH_PASSWORD:-labpass}
    networks:
      default:
        ipv4_address: 172.30.0.20

  target-web:
    image: nginx:1.27-alpine
    hostname: target-web
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.21

  target-redis:
    image: redis:7-alpine
    hostname: target-redis
    restart: unless-stopped
    networks:
      default:
        ipv4_address: 172.30.0.22

  # Opt-in attacker toolbox (nmap, hydra, scapy, tcpdump) for the lab attack
  # scenarios. LAB USE ONLY. Not started by `docker compose up` (profile below);
  # run it explicitly, e.g.
  #   docker compose --profile attack run --rm attacker /scripts/run_attacks.sh all
  attacker:
    build: ./attacker
    profiles: ["attack"]
    hostname: attacker
    # Raw packet crafting (scapy, nmap -sS) and ARP replies need these.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    networks:
      default:
        ipv4_address: 172.30.0.66
    volumes:
      - ./pcaps:/pcaps
      - ./scripts:/scripts:ro

networks:
  default:
    name: sentrix_lab
    ipam:
      config:
        - subnet: 172.30.0.0/24
          gateway: 172.30.0.1
          # Dynamic addresses for non-target services; .2-.127 is reserved for fixed IPs.
          ip_range: 172.30.0.128/25

volumes:
  pgdata:
  frontend_node_modules:
